<link rel="stylesheet" href="/css/recherche.css">
<link rel="stylesheet" href="/coureur/coureur.css">
<link rel="stylesheet" href="/css/autocomplete.css">

<script src="https://cdn.jsdelivr.net/npm/@tarekraafat/autocomplete.js@10.2.10/dist/autoComplete.min.js"></script>

<div class="page-card">
    <header class="page-header">
        <div class="page-header-top">
            <h1 class="page-title">
                Rechercher un coureur à partir de son nom
            </h1>
        </div>

        <div class="page-header-filters">
            <div class="zone-recherche recherche-autocomplete">
                <label for="search">
                    Nom du licencié
                </label>
                <div class="champ-recherche">
                    <div class="input-recherche">
                        <div class="autoComplete_wrapper">
                            <input
                                    id="search"
                                    type="text"
                                    placeholder="Saisir les premières lettres du nom"
                                    autocomplete="off">
                        </div>
                        <span class="icone-recherche" aria-hidden="true">⌕</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="page-body">
        <section class="bloc-info">
            <h2>👤 Identité</h2>
            <div class="champ">
                <span>Nom</span>
                <output id="nom" class="champ-sortie"></output>
            </div>
            <div class="champ">
                <span>Prénom</span>
                <output id="prenom" class="champ-sortie"></output>
            </div>
            <div class="champ">
                <span>Sexe</span>
                <output id="sexe" class="champ-sortie"></output>
            </div>
            <div class="champ">
                <span>Né(e) le</span>
                <output id="dateNaissance" class="champ-sortie"></output>
            </div>
        </section>

        <section class="bloc-info">
            <h2>🏆 Informations sportives</h2>
            <div class="champ">
                <span>Âge</span>
                <output id="age" class="champ-sortie"></output>
            </div>
            <div class="champ">
                <span>Catégorie</span>
                <output id="idCategorie" class="champ-sortie"></output>
            </div>
            <div class="champ">
                <span>Licence</span>
                <output id="licence" class="champ-sortie"></output>
            </div>
            <div class="champ">
                <span>Club</span>
                <output id="nomClub" class="champ-sortie"></output>
            </div>
        </section>
    </div>
</div>
