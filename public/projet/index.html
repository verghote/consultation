<style>
    /* =========================================================
   LISTE DES PROJETS
   ========================================================= */

    #lesProjets {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }


    /* =========================================================
       CARTE PROJET
       ========================================================= */

    .projet-card {
        width: 100%;

        border: 1px solid #d6dde5;
        border-radius: 10px;

        background: #ffffff;

        overflow: hidden;
    }


    /* =========================================================
       ENTÊTE DU PROJET
       ========================================================= */

    .projet-header {
        display: flex;

        align-items: center;
        justify-content: space-between;

        gap: 1rem;

        padding: .75rem 1rem;

        background: #f5f8fc;

        border-bottom: 1px solid #e3e9f0;
    }


    /* Nom du projet */

    .projet-nom {
        flex: 1 1 auto;

        min-width: 0;

        color: #26384a;

        font-size: 1rem;
        font-weight: 600;

        line-height: 1.3;
    }


    /* =========================================================
       BOUTON OUVERTURE / FERMETURE
       ========================================================= */

    .projet-toggle {
        flex: 0 0 auto;

        padding: .4rem .75rem;

        border: 1px solid #0790e4;
        border-radius: 6px;

        background: #ffffff;

        color: #0790e4;

        font-family: inherit;
        font-size: .85rem;
        font-weight: 600;

        cursor: pointer;

        transition:
                background-color .15s ease,
                color .15s ease;
    }

    .projet-toggle:hover {
        background: #0790e4;
        color: #ffffff;
    }

    .projet-toggle:focus-visible {
        outline: 3px solid rgba(7, 144, 228, .2);
        outline-offset: 2px;
    }


    /* =========================================================
       CORPS DU PROJET
       ========================================================= */

    .projet-body {
        padding: 1rem;

        background: #ffffff;
    }


    /* =========================================================
       TABLEAU DES COMPÉTENCES
       ========================================================= */

    .projet-table {
        width: 100%;

        margin: 0;

        border-collapse: collapse;
    }

    .projet-table th {
        background: #f1f5f9;

        color: #334155;

        font-weight: 600;

        white-space: nowrap;
    }

    .projet-table td,
    .projet-table th {
        padding: .55rem .75rem;

        border: 1px solid #e1e7ee;
    }

    .projet-table tbody tr:nth-child(even) {
        background: #f8fafc;
    }


    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media screen and (max-width: 600px) {

        .projet-header {
            align-items: flex-start;
            flex-direction: column;
            gap: .6rem;
        }

        .projet-toggle {
            width: 100%;
        }

        .projet-body {
            padding: .75rem;
            overflow-x: auto;
        }

        .projet-table {
            min-width: 500px;
        }
    }

</style>
<div class="page-card">
    <header class="page-header">
        <div class="page-header-top">
            <h1 class="page-title">
                Liste des projets
            </h1>
        </div>
    </header>

    <div class="page-body">
        <div id="msg"></div>
        <div id="lesProjets" class="projet-list"></div>
    </div>
</div>
